[package]
name = "kazeterm"
version.workspace = true
publish.workspace = true
edition.workspace = true
description = "A modern GPU-accelerated terminal emulator"
authors = ["fallenwood"]
license = "GPL-3.0"
repository = "https://github.com/fallenwood/kazeterm"

[dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["font-kit"] }
gpui-kit.workspace = true
futures.workspace = true
smol.workspace = true
rust-embed.workspace=true
clap.workspace = true
serde_json.workspace = true

config = { path = "../config" }
kazeterm-event-system = { path = "../kazeterm-event-system" }
kazeterm-ui-tree = { path = "../kazeterm-ui-tree" }
terminal = { path = "../terminal" }
terminal-kernel = { path = "../terminal-kernel" }
terminal-kernel-alacritty = { path = "../terminal-kernel-alacritty" }
themeing = { path = "../themeing" }
toml.workspace = true
serde.workspace = true
dirs.workspace = true
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
semver.workspace = true
urlencoding.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["font-kit", "test-support"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc.workspace = true
raw-window-handle.workspace = true

# Use native notification APIs on macOS and Windows.
# notify-rust is only needed on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
terminal-kernel-vte = { path = "../terminal-kernel-vte" }
notify-rust = { workspace = true }
which.workspace = true
raw-window-handle.workspace = true
x11rb.workspace = true
image = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }
windows.workspace = true
image.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui = { workspace = true, features = ["wayland"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource.workspace = true

[package.metadata.bundle]
icon = ["../../assets/icons/kazeterm.png"]
identifier = "net.fallenwood.kazeterm"
name = "Kazeterm"
category = "public.app-category.developer-tools"
short_description = "A terminal emulator"
copyright = "Copyright (c) fallenwood"
osx_minimum_system_version = "10.15"
