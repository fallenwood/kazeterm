[workspace]
resolver = "2"
members = [
  "crates/config",
  "crates/kazeterm-event-system",
  "crates/kazeterm",
  "crates/kazeterm-ui-tree",
  "crates/themeing",
  "crates/terminal",
  "crates/terminal-kernel",
  "crates/terminal-kernel-alacritty",
  "crates/terminal-kernel-unix-bundle",
  "crates/terminal-kernel-vte",
]
# Keep the default root build working on Windows while Unix builds still pull
# in the extra terminal kernels through the unix bundle crate.
default-members = [
  "crates/config",
  "crates/kazeterm-event-system",
  "crates/kazeterm",
  "crates/kazeterm-ui-tree",
  "crates/themeing",
  "crates/terminal",
  "crates/terminal-kernel",
  "crates/terminal-kernel-alacritty",
  "crates/terminal-kernel-unix-bundle",
]

[workspace.package]
version = "0.3.1"
publish = false
edition = "2024"

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false }
gpui-macros = "0.2.2"
gpui-component = "0.5.1"
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
smol = "2.0.2"
windows-core = "0.62.2"
image = "0.25.10"
itertools = "0.15.0"
futures = "0.3.34"
rust-embed = "8.12.0"
sysinfo = "0.39.6"
libc = "0.2"
toml = "1.1.5"
serde = { version = "1.0.229", features = ["derive"] }
dirs = "7.0.0"
regex = "1.13.1"
url = "2.5.8"
urlencoding = "2.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
notify-rust = "4.18.0"
which = "8.0.6"
semver = "1.0.28"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
insta = "1.48.0"
mimalloc = { version = "0.1.52", default-features = false }
objc = "0.2.7"
parking_lot = "0.12.5"
polling = "3.11.0"
raw-window-handle = "0.6.2"
serde_json = "1.0.151"
uds_windows = "1.2.1"
vte = "0.15.0"
winresource = "0.1.31"
x11rb = "0.14.0"

[workspace.dependencies.windows]
version = "0.62.2"
features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = false
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
rpath = true

[profile.release-fast]
inherits = "release"
debug = false
lto = false
codegen-units = 16
rpath = true

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[workspace.metadata.cargo-machete]
ignored = [
  "bindgen",
  "cbindgen",
  "prost_build",
  "serde",
  "component",
  "documented",
  "workspace-hack",
]
