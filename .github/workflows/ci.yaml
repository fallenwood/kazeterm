name: CI

on:
  push:
    branches: [ master ]
    tags: [ "*" ]

env:
  KAZETERM_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'wip' }}
  KAZETERM_PACKAGE_TAG: ${{ github.ref_name }}

jobs:
  build-release:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: X64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
          - os: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
          - os: windows-11-arm
            arch: X64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            arch: ARM64
            target: aarch64-apple-darwin
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set rust vesrion
        run: rustup override set 1.97.0

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # zizmor: ignore[cache-poisoning] v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt install -y \
            clang \
            llvm \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            zstd

      - name: Build
        if: runner.os == 'Windows'
        run: cargo build --target ${{ matrix.target }} --profile=release-fast

      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --target ${{ matrix.target }} --workspace --profile=release-fast

      - name: Install cargo-llvm-cov
        if: runner.os != 'Windows'
        run: cargo install cargo-llvm-cov --locked

      - name: Run tests
        if: runner.os == 'Windows' && matrix.arch == 'X64'
        run: cargo test --target ${{ matrix.target }} --workspace --all-features --exclude terminal-kernel-vte

      - name: Run coverage (tests included)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ./coverage
          cargo llvm-cov --target ${{ matrix.target }} --workspace --all-features --lcov --output-path coverage/lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux' && runner.arch == 'X64'
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Pack
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir ./dists
          mv target\${{ matrix.target }}\release-fast\kazeterm.exe ./kazeterm.exe
          $variant = "${{ runner.os}}-${{ matrix.arch }}".ToLower()
          7z a ./dists/kazeterm-$variant-$env:KAZETERM_PACKAGE_TAG.7z ./kazeterm.exe

      - name: Pack
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          mkdir -p ./dists
          $packDir = Join-Path (Resolve-Path .).Path "pack/linux"
          New-Item -ItemType Directory -Force -Path $packDir | Out-Null
          $variant = "${{ runner.os}}-${{ matrix.arch }}".ToLower()
          Copy-Item ./target/${{ matrix.target }}/release-fast/kazeterm $packDir
          tar --zstd -cf ./dists/kazeterm-$variant-$env:KAZETERM_PACKAGE_TAG.tar.zstd -C $packDir .

      - name: Install cargo-bundle
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --locked

      - name: Bundle macOS DMG
        if: runner.os == 'macOS'
        run: cargo bundle --target ${{ matrix.target }} --profile=release-fast --format=osx -p kazeterm

      - name: Pack
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          mkdir -p ./dists
          $binPackDir = Join-Path (Resolve-Path .).Path "pack/macos-bin"
          New-Item -ItemType Directory -Force -Path $binPackDir | Out-Null
          $variant = "${{ runner.os}}-${{ matrix.arch }}".ToLower()
          Copy-Item ./target/${{ matrix.target }}/release-fast/kazeterm $binPackDir
          tar -czf ./dists/kazeterm-$variant-$env:KAZETERM_PACKAGE_TAG.tar.gz -C $binPackDir .
          tar -czf ./dists/kazeterm-$variant-$env:KAZETERM_PACKAGE_TAG-dmg.tar.gz -C ./target/${{ matrix.target }}/release-fast/bundle/osx Kazeterm.app

      - name: Upload release asset
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # zizmor: ignore[superfluous-actions] v3.0.0
        with:
          tag_name: ${{ env.KAZETERM_RELEASE_TAG }}
          prerelease: ${{ env.KAZETERM_RELEASE_TAG == 'wip' }}
          files: |
            ./dists/*
